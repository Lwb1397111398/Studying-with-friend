<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: transparent; }
  #map { height: 100%; width: 100%; }
  #toolbar {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 2px; background: rgba(28,28,34,.92); border-radius: 22px;
    padding: 6px 8px; box-shadow: 0 4px 16px rgba(0,0,0,.3); z-index: 9999;
    /* 固定定位下 shrink-to-fit 只有 left 到右缘的宽度，会过窄换行，显式给宽度 */
    width: max-content; max-width: 96vw;
    flex-wrap: wrap; justify-content: center;
  }
  #toolbar button {
    border: none; background: transparent; color: #fff; font-size: 13px;
    min-width: 38px; height: 34px; border-radius: 10px; padding: 0 4px;
    font-family: sans-serif;
  }
  #toolbar button:active { background: rgba(255,255,255,.18); }
  #toolbar button:disabled { opacity: .3; }
</style>
</head>
<body>
<div id="map"></div>
<div id="toolbar">
  <button id="btChild">＋子</button>
  <button id="btSibling">＋同</button>
  <button id="btEdit">改名</button>
  <button id="btDel">删除</button>
  <button id="btUp">↑</button>
  <button id="btDown">↓</button>
  <button id="btUndo">撤销</button>
  <button id="btRedo">重做</button>
  <button id="btCenter">居中</button>
  <button id="btZoomOut">－</button>
  <button id="btZoomIn">＋</button>
  <button id="btFit">适应</button>
  <button id="btReset">1:1</button>
</div>
<script src="MindElixirFull.iife.js"></script>
<script>
var ME = MECore.default;
var mind = null;
var dark = false;
var saveTimer = null;

// 不依赖 CSS 高度百分比链（部分 WebView 上 body{height:100%} 不生效），全部用像素钉死
function fixSize() {
  var h = window.innerHeight + 'px';
  var w = window.innerWidth + 'px';
  document.documentElement.style.height = h;
  document.body.style.height = h;
  var map = document.getElementById('map');
  map.style.height = h;
  map.style.width = w;
}
window.addEventListener('resize', fixSize);
window.addEventListener('load', fixSize);
fixSize();

function selectedEl() {
  if (!mind) return null;
  var sel = mind.currentSelected;
  if (sel && sel.length) return sel[sel.length - 1];
  return null;
}

function isRoot(el) { return el && el.id === 'me-root'; }

function updateButtons() {
  var el = selectedEl();
  var has = !!el;
  var root = isRoot(el);
  document.getElementById('btSibling').disabled = !has || root;
  document.getElementById('btEdit').disabled = !has;
  document.getElementById('btDel').disabled = !has || root;
  document.getElementById('btUp').disabled = !has || root;
  document.getElementById('btDown').disabled = !has || root;
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function () {
    if (!mind) return;
    try {
      AndroidBridge.onMapChanged(JSON.stringify(mind.getData()));
    } catch (e) { console.error(e); }
  }, 500);
}

function applyDark() {
  if (!mind) return;
  try {
    mind.changeTheme(dark ? ME.DARK_THEME : ME.THEME, true);
  } catch (e) { console.error(e); }
}

window.appInit = function (jsonText, darkMode) {
  console.log('appInit called, len=' + (jsonText || '').length);
  var el = document.getElementById('map');
  if (mind) { try { mind.destroy(); } catch (e) {} mind = null; }
  dark = !!darkMode;
  var data;
  try { data = JSON.parse(jsonText); } catch (e) { AndroidBridge.onLog('bad json: ' + e); return; }
  try {
    var opts = {
      el: el,
      direction: ME.SIDE,
      locale: 'zh_CN',
      draggable: true,
      editable: true,
      contextMenu: true,
      toolBar: false,
      keypress: false,
      // 注意：overflowHidden 必须保持默认 false。
      // 本 mind-elixir 构建只在 overflowHidden=false 时才注册触摸手势
      // （双指捏合缩放 / 单指平移），传 true 会导致导图完全无法缩放拖动。
      newTopicName: '新节点',
      allowUndo: true,
      scaleMax: 3,
      scaleMin: 0.15,
      scaleSensitivity: 0.2,
      before: {},
    };
    mind = new ME(opts);
    try { mind.install(ME.nodeDraggable); } catch (e) { console.log('install drag fail: ' + e); }
    try { mind.install(ME.operationHistory); } catch (e) { console.log('install history fail: ' + e); }
    var err = mind.init(data);
    console.log('init result: ' + err);
    if (dark) applyDark();
    try {
      mind.bus.addListener('operation', function () { scheduleSave(); updateButtons(); });
    } catch (e) { console.log('bus fail: ' + e); }
    setTimeout(function () { updateButtons(); }, 60);
  } catch (e) {
    console.log('appInit exception: ' + (e && e.stack || e));
  }
};

window.appSetData = function (jsonText) {
  if (!mind) return;
  try {
    var data = JSON.parse(jsonText);
    mind.refresh(data);
    // AI 重写内容后让整图适应屏幕，保证新导图一眼能看全
    setTimeout(function () { try { mind.scaleFit(); mind.toCenter(); } catch (e) {} }, 50);
  } catch (e) { console.log('setData fail: ' + e); }
};

window.appSetEditable = function (flag) {
  if (!mind) return;
  try { flag ? mind.enableEdit() : mind.disableEdit(); } catch (e) {}
};

window.appSetDark = function (flag) { dark = !!flag; applyDark(); };

window.appAddChild = function () {
  if (!mind) return;
  // 无选中时默认对根节点添加子节点
  var el = selectedEl() || document.querySelector('#map me-root me-tpc');
  mind.addChild(el);
  setTimeout(updateButtons, 100);
};
window.appAddSibling = function () { var el = selectedEl(); if (el && !isRoot(el)) { mind.insertSibling('after', el); setTimeout(updateButtons, 100); } };
window.appBeginEdit = function () { var el = selectedEl(); if (el) mind.beginEdit(el); };
window.appRemove = function () { var el = selectedEl(); if (el && !isRoot(el)) { mind.removeNode(el); setTimeout(updateButtons, 100); } };
window.appMoveUp = function () { var el = selectedEl(); if (el && !isRoot(el)) mind.moveUpNode(el); };
window.appMoveDown = function () { var el = selectedEl(); if (el && !isRoot(el)) mind.moveDownNode(el); };
window.appUndo = function () { try { mind.undo(); } catch (e) {} setTimeout(updateButtons, 100); };
window.appRedo = function () { try { mind.redo(); } catch (e) {} setTimeout(updateButtons, 100); };
window.appToCenter = function () { if (mind) mind.toCenter(); };
window.appZoomIn = function () {
  if (!mind) return;
  try { mind.scale(Math.min(mind.scaleMax, mind.scaleVal + mind.scaleSensitivity)); } catch (e) {}
};
window.appZoomOut = function () {
  if (!mind) return;
  try { mind.scale(Math.max(mind.scaleMin, mind.scaleVal - mind.scaleSensitivity)); } catch (e) {}
};
window.appZoomFit = function () {
  if (!mind) return;
  try { mind.scaleFit(); mind.toCenter(); } catch (e) {}
};
window.appZoomReset = function () {
  if (!mind) return;
  try { mind.scale(1); mind.toCenter(); } catch (e) {}
};

window.appExportPng = function () {
  if (!mind) return;
  try {
    mind.exportPng().then(function (blob) {
      if (!blob) return;
      var fr = new FileReader();
      fr.onload = function () {
        var s = String(fr.result);
        var b64 = s.indexOf('base64,') >= 0 ? s.split('base64,')[1] : s;
        AndroidBridge.onPngReady(b64);
      };
      fr.readAsDataURL(blob);
    }).catch(function (e) { console.log('png fail: ' + e); });
  } catch (e) { console.log('png fail: ' + e); }
};

document.getElementById('btChild').onclick = function () { window.appAddChild(); };
document.getElementById('btSibling').onclick = function () { window.appAddSibling(); };
document.getElementById('btEdit').onclick = function () { window.appBeginEdit(); };
document.getElementById('btDel').onclick = function () { window.appRemove(); };
document.getElementById('btUp').onclick = function () { window.appMoveUp(); };
document.getElementById('btDown').onclick = function () { window.appMoveDown(); };
document.getElementById('btUndo').onclick = function () { window.appUndo(); };
document.getElementById('btRedo').onclick = function () { window.appRedo(); };
document.getElementById('btCenter').onclick = function () { window.appToCenter(); };
document.getElementById('btZoomIn').onclick = function () { window.appZoomIn(); };
document.getElementById('btZoomOut').onclick = function () { window.appZoomOut(); };
