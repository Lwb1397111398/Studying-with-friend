name: build-release

# 应用自更新（M7）：每次推 main 自动构建 Release APK 并发布到 latest Release，
# 手机端「检查更新」即可发现并下载安装，无需连电脑。
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

# 发布串行化：两次推送的 CI 并发跑会同时 --clobber 同一个资产，上传互相踩会把
# Release 资产写坏——手机端下载后装上就是系统安装器报「软件包似乎无效」。
# cancel-in-progress 必须 false（排队而不是取消）：取消正在上传中的任务同样留下坏资产。
concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode = git 提交数，必须拿全量历史
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 还原签名密钥（GitHub secret 注入；密钥本体已不入库）
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/app.keystore
            echo "签名密钥已还原"
          else
            echo "::warning::缺少 ANDROID_KEYSTORE_BASE64 secret，本次构建产物将未签名、不可安装"
          fi

      - name: 构建 Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: 发布到 latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(git rev-list --count HEAD)
          NAME="0.1.$CODE"
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          cp "$APK" StudyingWithFriend-latest.apk
          # 安装包指纹：App 下载完成后按此校验内容（只验字节数拦不住「长度对但内容坏」的包，
          # 手机端装出来就是「软件包似乎无效」）；写入第二行注释，见 UpdateChecker.parseUpdateMeta
          SUM=$(sha256sum StudyingWithFriend-latest.apk | cut -d' ' -f1)

          # 第一行 HTML 注释是机器可读元数据（App 解析 versionCode 判断有无新版本），
          # GitHub 页面渲染时不可见；SHA-256 必须放第二个注释行——旧版 App 的解析正则
          # 要求 versionName 后紧跟 -->，同行加字段会让存量手机全部「远端版本信息无法识别」
          {
            echo "<!-- studyfriend-update versionCode=$CODE versionName=$NAME -->"
            echo "<!-- studyfriend-update-sha256=$SUM -->"
            echo "自动构建 · 提交 ${GITHUB_SHA::7}"
            echo
            echo "更新内容："
            git log --pretty=format:'- %s' -5
          } > notes.md

          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest StudyingWithFriend-latest.apk --clobber
            gh release edit latest --title "学伴 App $NAME" --notes-file notes.md
          else
            gh release create latest StudyingWithFriend-latest.apk \
              --title "学伴 App $NAME" --notes-file notes.md
          fi

          # 发布自验：把刚发布的资产回读下来比对指纹，上传写坏宁可 CI 红也别发坏包出去
          rm -rf verify_dl
          gh release download latest --pattern 'StudyingWithFriend-latest.apk' --dir verify_dl
          DOWN=$(sha256sum verify_dl/StudyingWithFriend-latest.apk | cut -d' ' -f1)
          if [ "$DOWN" != "$SUM" ]; then
            echo "::error::发布资产自验失败：云端下载的包与本地构建不一致（上传疑似损坏，禁止发版）"
            exit 1
          fi
          echo "已发布：versionCode=$CODE versionName=$NAME sha256=$SUM（云端资产回读比对一致）"
