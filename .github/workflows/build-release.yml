name: build-release

# 应用自更新（M7）：每次推 main 自动构建 Release APK 并发布到 latest Release，
# 手机端「检查更新」即可发现并下载安装，无需连电脑。
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode = git 提交数，必须拿全量历史
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 构建 Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: 发布到 latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(git rev-list --count HEAD)
          NAME="0.1.$CODE"
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          cp "$APK" StudyingWithFriend-latest.apk

          # 第一行 HTML 注释是机器可读元数据（App 解析 versionCode 判断有无新版本），
          # GitHub 页面渲染时不可见
          {
            echo "<!-- studyfriend-update versionCode=$CODE versionName=$NAME -->"
            echo "自动构建 · 提交 ${GITHUB_SHA::7}"
            echo
            echo "更新内容："
            git log --pretty=format:'- %s' -5
          } > notes.md

          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest StudyingWithFriend-latest.apk --clobber
            gh release edit latest --title "学伴 App $NAME" --notes-file notes.md
          else
            gh release create latest StudyingWithFriend-latest.apk \
              --title "学伴 App $NAME" --notes-file notes.md
          fi
          echo "已发布：versionCode=$CODE versionName=$NAME"
